# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "cf-pages"
production_branch = "main"
custom_domains = [
    "airsucks.com",
]

[index]
indexnow_key = "dbe4128b785da11e5eb575de32ee68c3"
indexnow_enabled = true

[stack]
framework = "tanstack"

[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "tool"        # diagnostic tool — v2 (smells) is the lead silo since 2026-10-02; v1 vacuums paused
primary_keyword = "musty smell in house"  # the one phrase this site should rank for (changed 2026-10-02, docs/prd.md § v2 decisions log)
secondary_keywords = [
    "how to get rid of musty smell in house",
    "why does my house smell musty",
    "musty smell in basement",
    "why does my room smell musty",
    "house smells like rotten eggs",
    "house smells musty but no mold",
    "house smells like gas but no leak",
    "my house smells like sewage",
    "musty smell from AC",
    "house smells like cat pee but I can't find it",
    "house smells like dog",
    "vacuum lost suction",
]
icp = "A homeowner or renter with a smell in the house they can't explain — musty, rotten eggs, sewage, gas, burning, pet — who wants to know whether it's dangerous, what's causing it, and whether they can fix it themselves before paying a pro."
urgency_trigger = "The smell just appeared or won't go away, they're worried it's gas, mold, or something electrical, and they're deciding right now whether to leave, call someone, or investigate."
penalty = "Either a missed hazard (gas, overheating wiring) or wasted money — air fresheners, mold tests, and pro visits for what's often a dry drain trap, an AC drain, or humidity they could fix themselves."
tone = "practical, plain-English, reassuring; DIY-first but honest about when to call a pro (explicitly not medical advice)"
law = ""                  # statute or regulation if applicable, else empty
