# lamill.toml — per-site config consumed by lamill (portfolio/ops) and rankmill (content/audits).
# [content] = stable identity, authored by hand. [todo] = volatile work state.
# rankmill output lives in sites/<domain>/rankmill-output/, not here.

schema = "lamill-toml-v1"

[deploy]
platform = "cf-pages"
production_branch = "main"
custom_domains = [
    "airsucks.com",
]

[index]
indexnow_key = "dbe4128b785da11e5eb575de32ee68c3"
indexnow_enabled = true

[stack]
framework = "tanstack"

[content]
# Declarative content identity for this site.
# Authored by the human; consumed by rankmill to generate drafts and run audits.
# Leave fields empty until you have a deliberate answer. Empty is better than wrong.
site_type = "tool"        # diagnostic tool (v1 = vacuums; odor + airflow follow)
primary_keyword = "vacuum lost suction"   # the one phrase this site should rank for
secondary_keywords = [
    "vacuum not picking up",
    "vacuum smells like burning",
    "vacuum overheating",
    "room smells musty",
    "musty smell in house",
    "weak airflow from vents",
]
icp = "A homeowner whose vacuum (or home air) suddenly stopped working right — weak suction, a bad smell, poor airflow — who wants to diagnose the cause and decide fix-vs-replace before spending money."
urgency_trigger = "Their vacuum just failed or a smell won't go away and they're about to buy a replacement or call a pro — they want to know if it's a 5-minute fix first."
penalty = "Overspending — a new $200+ vacuum or a pro visit for what's often a clogged filter or full bin they could fix free in minutes."
tone = "practical, plain-English, reassuring; DIY-first but honest about when to call a pro (explicitly not medical advice)"
law = ""                  # statute or regulation if applicable, else empty
